; Dialogue tuning. Reload the game to apply edits.
; Times are seconds. Distances are world pixels (one tile = 64 pixels).

[idle]
enabled = true
first_delay_min = 2.0
first_delay_max = 4.0
; Wait after a conversation finishes before trying another idle bark.
interval_min = 6.0
interval_max = 12.0
; Retry if a cooldown or unavailable line prevented an idle bark.
retry_delay = 1.0

[random]
; These values override the defaults in dialogues_structured.json.
global_cooldown_seconds = 3.0
same_line_cooldown_seconds = 30.0
prevent_immediate_repeat = true
reply_chance = 0.5

[separation]
enabled = true
; Speak after moving more than 6 tiles apart.
trigger_distance = 384.0
; Come back within 4 tiles to allow a future separation trigger.
reset_distance = 256.0
cooldown_seconds = 25.0
check_interval = 0.5

[bubble]
; Maximum body size in world tiles; tail adds less than 0.25 tile.
max_width_tiles = 2.75
max_height_tiles = 2.5
base_duration = 1.5
seconds_per_character = 0.055
min_duration = 2.5
max_duration = 12.0
; Pause between lines in stories, exchanges, and replies.
line_gap = 0.35
